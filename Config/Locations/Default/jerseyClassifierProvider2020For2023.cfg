// 球衣颜色分类器参数 - 比赛现场可直接修改，无需重新编译
// ======================================================================

// 球衣在图像中的预期高度范围(mm)
jerseyYRange = { min = 300; max = 410; };

// 扫描最大亮度时的高度比例(0~1)，用于确定maxBrightness参考点
whiteScanHeightRatio = 0.8;

// 亮度范围比例，用于区分黑色/灰色/白色球衣
//   min: 亮度 <= maxBrightness*min 判为黑色
//        黑色识别不到 -> 调高   彩色被误判为黑色 -> 调低
//   max: 亮度在 min~max 之间判为灰色(预留，当前未使用)
grayRange = { min = 0.55; max = 0.67; };

// 球衣扫描最小垂直采样数
jerseyMinYSamples = 12;

// 球衣扫描最大垂直采样数
jerseyMaxYSamples = 20;

// 球衣扫描最大水平采样数
jerseyMaxXSamples = 30;

// 球衣在扫描区域中的相对宽度（只影响权重衰减，不影响扫描范围）
relativeJerseyWidth = 0.5;

// [FIX] 横向扫描宽度占障碍物 bbox 宽度的比例
//   1.0 = 扫描整个 bbox（含手臂）
//   0.7 = 只扫描中间 70%，手臂不被采样
//   调小 -> 排除更多手臂；调小过头 -> 球衣中心区采样不足
scanWidthRatio = 0.7;

// 色调相似度阈值(范围0-128)，色调偏差在此范围内视为匹配
//   调大 -> 更宽松，识别率高但易误判   调小 -> 更严格，误判少但可能漏检
hueSimilarityThreshold = 30;

// 饱和度分界线，仅在无彩色球衣参与时用于区分灰/黑/白
colorDelimiter = 110;

// 是否对每个像素单独加权(true)还是统一权重1(false)
weighPixels = true;

// 最小球衣像素占比，低于此比例则不做分类判定
minJerseyWeightRatio = 0.1;

// 最小优势比例，某颜色像素需占总彩色像素的此比例以上才确定分类
//   调高 -> 需要更明确的颜色优势才做判定   调低 -> 更容易做出判定
minJerseyRatio = 0.35;

// 白色扫描的y像素偏移量
whiteScanOffSet = 4;

// 弃用,saturated < 此值的像素可能是非彩色(黑/灰/白)
satThreshold = 95;

//  !!!弃用
//[FIX] 饱和度噪声阈值：低于此值时色调(hue)无意义，黑色分类器跳过色调检查
//   黑色像素饱和度极低(0~30)，色调是随机噪声，原代码误用噪声色调拒绝了真黑色像素
//   调高 -> 更多黑色像素跳过色调检查(识别率↑但深色彩色可能误判为黑)
//   调低 -> 更严格要求色调远离彩色(误判↓但可能漏掉部分黑色像素)
minColoredSaturation = 30;